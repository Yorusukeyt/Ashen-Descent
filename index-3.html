<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Ashen Descent</title>
<style>
:root{--bg:#0e0c0b;--panel:#1a1613;--bone:#d9cdb0;--dim:#8a7f6a;--ember:#d9822b;--blood:#9c2b2b;--moss:#4f8f58;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:'Courier New',monospace;font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{height:100%;display:flex;flex-direction:column}
#wrap{flex:1;min-height:0;position:relative}
canvas{width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated}
#ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;background:rgba(10,8,7,.86);text-align:center;padding:10px;overflow-y:auto}
#ui.off{display:none}
#ui.tt{background:none;justify-content:flex-end;padding-bottom:10px}
body.menu #stick,body.menu #btns{display:none}
#ui.bf{background:none;align-items:flex-end;justify-content:center;padding:8px 14px 8px 8px}
.bfp{width:300px;max-width:100%;box-sizing:border-box;background:rgba(10,8,7,.3);border:1px solid rgba(217,205,176,.3);text-shadow:0 1px 3px #000;padding:8px 12px;display:flex;flex-direction:column;gap:6px;align-items:center;max-height:100%;overflow:auto}
.bfp button.m{min-width:0;width:100%;padding:6px 10px;font-size:.85rem}
.bfp h1{font-size:1.3rem}
.bfp button.m{background:rgba(26,22,19,.4)}
@media (pointer:coarse){.bfh{display:none}}
h1{font-size:1.6rem;letter-spacing:.08em;margin:0;font-weight:700}
h1.red{color:var(--blood)}
p{margin:0;color:var(--dim);font-size:.95rem;line-height:1.5;max-width:30ch}
button.m{background:var(--panel);color:var(--bone);border:2px solid var(--dim);border-radius:0;box-shadow:3px 3px 0 #000;padding:9px 16px;font:inherit;font-size:1rem;min-width:240px}
button.m:active{border-color:var(--ember);color:var(--ember)}
button.m:disabled{opacity:.4}
button.m.sel{border-color:var(--ember);color:var(--ember)}
#ctl{position:absolute;inset:0;pointer-events:none;z-index:1}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:14px;width:120px;height:120px;border-radius:50%;border:1px solid var(--dim);background:rgba(10,8,7,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--dim);opacity:.7}
#btns{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:14px;display:grid;grid-template-columns:repeat(2,62px);gap:8px;pointer-events:auto}
#btns button{height:62px;border-radius:4px;border:1px solid var(--dim);background:rgba(26,22,19,.7);color:var(--bone);font:inherit;font-size:.8rem;touch-action:none}
#btns button:active{background:var(--ember);color:#000}
#mt{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:none;border:0;font-size:1.3rem;opacity:.7;pointer-events:auto;padding:6px 10px}
</style></head><body>
<div id="app">
<div id="wrap"><canvas id="c" width="280" height="180"></canvas><div id="ctl"><button id="mt">🔊</button><div id="stick"><div id="knob"></div></div>
<div id="btns"><button data-a="hvy">Heavy</button><button data-a="atk">Strike</button><button id="fb" data-a="flask">Flask</button><button data-a="roll">Roll</button></div></div><div id="ui"></div></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=560,H=360,UI=document.getElementById('ui');
let store={embers:0,best:0};
try{Object.assign(store,JSON.parse(localStorage.getItem('ashen')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ashen',JSON.stringify(store))}catch(e){}};
const today=new Date().toISOString().slice(0,10);
const seed=[...today].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let AC=null,muted=false;
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}));
document.getElementById('mt').addEventListener('pointerdown',e=>{e.preventDefault();muted=!muted;e.target.textContent=muted?'🔇':'🔊'});
function tone(f,d,ty,v,f2){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fr){if(!AC||muted)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=fr;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
const SFX={swing:()=>noise(.15,.25,2500),roll:()=>noise(.25,.18,500),heavy:()=>{noise(.3,.4,900);tone(90,.3,'sawtooth',.12,50)},hit:()=>{noise(.1,.45,700);tone(160,.12,'square',.1,60)},flask:()=>{tone(400,.15,'sine',.12,700);setTimeout(()=>tone(500,.2,'sine',.12,800),130)},hurt:()=>{tone(120,.25,'sawtooth',.2,40);noise(.2,.3,400)},wind:()=>tone(220,.12,'triangle',.05,330),slam:()=>{tone(60,.5,'sawtooth',.3,25);noise(.4,.4,300)},kill:()=>tone(300,.25,'triangle',.12,600),die:()=>{tone(200,1.2,'sawtooth',.2,30);noise(.8,.15,200)},bonfire:()=>{noise(.7,.15,300);tone(330,.5,'sine',.1)},win:()=>[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.4,'triangle',.15),i*160))};
const CH=[[73.4,110,146.8,174.6],[58.3,87.3,116.5,146.8],[49,73.4,98,116.5],[55,82.4,110,138.6]],SC=[293.7,311.1,349.2,392,440,466.2,523.3,587.3];
let mbar=0,mt0=0;
function pad(f,t,d,v){const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=480;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.4);g.gain.linearRampToValueAtTime(0,t+d);o.connect(fl);fl.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function bell(f,t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+2.5)}
function thump(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(35,t+.25);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.35)}
setInterval(()=>{
 if(!AC||muted)return;const now=AC.currentTime;if(mt0-now>1.5)return;
 const t=Math.max(mt0,now+.1),ch=CH[mbar++%4];
 if(room%5==0&&mode=='play'){bossBar(t,room);mt0=t+(room==5?3.2:2);return}
 for(let s=0;s<16;s++){const ts=t+s*.15;
  if(s%4==0)tone2(ch[0]*2,ts,.28,'triangle',.14);
  if(s%2==0||room%5==0&&mode=='play')tone2(ch[(s>>1)%4]*4,ts,.12,'square',.05);
  if(s==0||s==8)thump(ts)}
 if(Math.random()<.7)tone2(SC[Math.floor(Math.random()*8)]*2,t+(Math.floor(Math.random()*8)*2+1)*.15,.2,'square',.05);
 if(room%5==0&&mode=='play')for(let s=4;s<16;s+=4)thump(t+s*.15);
 mt0=t+2.4;
},500);
function angd(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d)}

let mode='title',P=null,E=[],room=1,shake=0,buf=null,bt=0,flash=0;
const K={},T={mx:0,my:0};
const DEF={
 hollow:{r:10,hp:30,sp:55,rng:34,arc:.7,dmg:14,wd:.6,rc:.7,so:25,col:'#7d8c6c'},
 knight:{r:12,hp:75,sp:36,rng:50,arc:1.0,dmg:28,wd:.95,rc:1,so:60,col:'#6d7390'},
 lord:{r:34,hp:800,sp:50,rng:80,arc:.9,dmg:28,wd:.7,rc:.8,so:1500,col:'#d9822b',boss:1},
 archer:{r:9,hp:24,sp:42,rng:40,ky:190,arc:.5,dmg:12,wd:.7,rc:1.6,so:35,col:'#6a8a5a'},
 mage:{r:10,hp:38,sp:30,rng:40,ky:170,arc:.5,dmg:24,wd:.6,rc:2.2,so:55,col:'#8a5ac8'},
 vortex:{r:13,hp:58,sp:27,rng:150,arc:1,dmg:18,wd:.85,rc:1.25,so:65,col:'#4b91b8'},
 hound:{r:11,hp:42,sp:56,rng:40,arc:1.2,dmg:16,wd:.55,rc:.5,so:40,col:'#a88b69'},
 warden:{r:30,hp:520,sp:54,rng:72,arc:.9,dmg:38,wd:.7,rc:.7,so:600,col:'#a3402c',boss:1}
};
function mk(t,x,y){const d=DEF[t];const sc=d.boss?1+(room-1)*.04:1+(room-1)*.11;return{t,x,y,...d,hp:d.hp*sc,mhp:d.hp*sc,dmg:d.dmg*(1+(room-1)*.03),s:'chase',tm:0,cd:1.2,fl:0,face:0,k:'swing',h:0}}
function loadRoom(){
 const R=mb(seed+room*997);E=[];AR=[];ZN=[];PP=[];AL=[];TR=[];
 if(room==5||room==10){E.push(mk(room==5?'warden':'lord',W/2,90));bossIntro=2.8;bossName=room==5?['THE ASHEN WARDEN','Gaoler of the Cinder Gate']:['THE EMBER LORD','Sovereign of the Dying Flame'];SFX.bossIntro(room)}
 else{const n=Math.min(12,2+Math.floor(room*.95)),kp=room>=3?.1+.03*room:0,ap=room>=2?.2:0,mp=room>=3?.17:0,vp=room>=3?.13:0,dp=room>=2?.16:0;
  for(let i=0;i<n;i++){const x=R();E.push(mk(x<dp?'hound':x<dp+vp?'vortex':x<dp+vp+kp?'knight':x<dp+vp+kp+ap?'archer':x<dp+vp+kp+ap+mp?'mage':'hollow',40+R()*(W-80),40+R()*130))}E.forEach((e,i)=>e.cd+=i*.3)}
 P.x=W/2;P.y=H-90;P.act=null;P.hi=1;
}
function startRun(c){buf=null;if(typeof c!='string')c=lastCls;lastCls=c;store.runs=(store.runs||0)+1;save();const Q=CL[c];
 P={x:0,y:0,r:9,hp:Q.hp,mhp:Q.hp,st:Q.st,mst:Q.st,dmg:Q.dmg,fl:Q.fl,fmax:Q.fl,cm:Q.cm||1,sp:Q.sp,rg:Q.rg,cls:c,ab:Q.ab,wall:0,souls:Math.min(store.embers,100),lvl:1,face:-Math.PI/2,act:null,t:0,hit:0,hi:0,sd:0,stun:0,rx:0,ry:0};
 document.getElementById('fb').textContent=Q.ab;room=1;loadRoom();mode='play';UI.className='off';
}
const DUR={atk:.38,hvy:.75,roll:.4,flask:.7},COST={atk:15,hvy:30,roll:20,flask:0};
function press(a){buf=a;bt=.28}
addEventListener('keydown',e=>{K[e.code]=1;const m={KeyJ:'atk',KeyK:'hvy',Space:'roll',KeyE:'flask'}[e.code];if(m)press(m);if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();press(b.dataset.a)}));
const st=document.getElementById('stick'),kn=document.getElementById('knob');let sid=null;
function sv(e){const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),mx=r.width/2;if(m>mx){dx*=mx/m;dy*=mx/m}T.mx=dx/mx;T.my=dy/mx;kn.style.transform=`translate(${dx}px,${dy}px)`}
st.addEventListener('pointerdown',e=>{sid=e.pointerId;st.setPointerCapture(e.pointerId);sv(e)});
st.addEventListener('pointermove',e=>{if(e.pointerId===sid)sv(e)});
const up=e=>{if(e.pointerId===sid){sid=null;T.mx=T.my=0;kn.style.transform=''}};
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);

function hurt(d){
 if(P.hi>0||(P.act=='roll'&&P.t>.04&&P.t<.3))return;
 if(P.wall>0){P.hp-=d*.2;P.hi=.2;SFX.hit();dn(P.x,P.y-16,'BLOCK','#7fb3ff');if(P.hp<=0)die();return}P.hp-=d;P.hi=.45;P.stun=.25;P.act=null;shake=9;flash=.15;SFX.hurt();hs=.12;spark(P.x,P.y,14,'#cc3333');dn(P.x,P.y-16,'-'+Math.round(d),'#ff5555');
 if(P.hp<=0)die();
}
function nearest(R){let b=null,bd=R||90;for(const e of E){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd){bd=d;b=e}}return b}
function swing(rg,arc,mult,stag){
 for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;
  if(d<rg+e.r&&angd(Math.atan2(dy,dx),P.face)<arc){
   e.hp-=P.dmg*mult;e.fl=.12;SFX[mult>1?'heavy':'hit']();hs=mult>1?.1:.05;spark(e.x,e.y,mult>1?12:6,'#ffe9a8');dn(e.x,e.y-e.r,Math.round(P.dmg*mult),'#ffe9a8');shake=Math.max(shake,3);
   if(stag&&!e.boss&&e.s!='strike'){e.s='rec';e.tm=0;e.rc=.7}
   e.x+=dx/d*6;e.y+=dy/d*6;if(e.hp<=0)e.dead=1}}
 let boss=0;E=E.filter(e=>{if(e.dead){SFX.kill();spark(e.x,e.y,e.boss?60:24,e.col);hs=e.boss?.3:.12;shake=Math.max(shake,e.boss?18:6);dn(e.x,e.y-20,'+'+e.so,'#d9822b');P.souls+=e.so;if(e.boss&&room==10)boss=1}return!e.dead});
 if(boss)win();
}
function update(dt){if(bossIntro>0){bossIntro-=dt;buf=null;return}
 shake=Math.max(0,shake-30*dt);flash-=dt;
 for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}PT=PT.filter(p=>p.l>0);
 for(const t of TR)t.l-=dt;TR=TR.filter(t=>t.l>0);
 for(const d of DN){d.y-=30*dt;d.l-=dt}DN=DN.filter(d=>d.l>0);
 for(const r of AR){r.x+=r.vx*dt;r.y+=r.vy*dt;r.l-=dt;if(Math.hypot(r.x-P.x,r.y-P.y)<P.r+3&&!(P.hi>0||(P.act=='roll'&&P.t>.04&&P.t<.3))){hurt(r.dm||12);r.l=0}if(r.x<0||r.x>W||r.y<0||r.y>H)r.l=0}AR=AR.filter(r=>r.l>0);
 for(const z of ZN){z.t+=dt;
  if(z.vortex){const dx=z.x-P.x,dy=z.y-P.y,d=Math.hypot(dx,dy)||1;if(d<z.r&&P.hi<=0&&!(P.act=='roll'&&P.t>.04&&P.t<.3)){const pull=(1-d/z.r)*z.pull;P.x+=dx/d*pull*dt;P.y+=dy/d*pull*dt;if(d<22&&z.t>.35&&z.cd<=0){z.cd=.7;hurt(z.dm)}}if(z.t>=z.d){spark(z.x,z.y,24,'#70d9ff');z.dead=1}}
  else if(z.t>=z.d){spark(z.x,z.y,18,'#b06aff');shake=Math.max(shake,6);SFX.boom();if(Math.hypot(z.x-P.x,z.y-P.y)<z.r+P.r*.5)hurt(z.dm);z.dead=1}}ZN=ZN.filter(z=>!z.dead);
 for(const p of PP){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;for(const e of E){if(p.h.includes(e))continue;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+3){p.h.push(e);dmgE(e,p.dm,p.pi);if(!p.pi)p.l=0}}if(p.x<0||p.x>W||p.y<0||p.y>H)p.l=0}PP=PP.filter(p=>p.l>0);
 for(const a of AL){a.l-=dt;a.cd-=dt;let n=null,bd=1e9;for(const e of E){const d=Math.hypot(e.x-a.x,e.y-a.y);if(d<bd){bd=d;n=e}}
  if(n){const d=bd||1;if(d>n.r+8){a.x+=(n.x-a.x)/d*95*dt;a.y+=(n.y-a.y)/d*95*dt}else if(a.cd<=0){a.cd=.9;dmgE(n,P.dmg*.5,0)}a.fx=n.x<a.x}else{a.x+=(P.x-a.x)*dt;a.y+=(P.y-a.y)*dt}}
 AL=AL.filter(a=>a.l>0);reap();
 if(bt>0){bt-=dt;if(bt<=0)buf=null}
 P.hi-=dt;P.stun-=dt;P.sd-=dt;P.sf=(P.sf||0)-dt;P.wall-=dt;
 let ix=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+T.mx,iy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0)+T.my;
 let m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;m=1}
 if(!P.act&&P.stun<=0&&buf){const a=buf;
  if(a=='flask'){if(P.fl>0){P.fl--;P.act='flask';P.t=0;P.hit=0;buf=null;SFX.flask()}else{buf=null;P.sf=.3;tone(110,.1,'square',.08)}}
  else if(P.st>=COST[a]*(P.cm||1)){P.st-=COST[a]*(P.cm||1);P.sd=.6;P.act=a;P.t=0;P.hit=0;buf=null;SFX[a=='roll'?'roll':'swing']();
   if(a=='roll'){const l=m>.15?m:1;P.rx=m>.15?ix/l:Math.cos(P.face);P.ry=m>.15?iy/l:Math.sin(P.face)}
   else{const n=nearest(P.rg);if(n)P.face=Math.atan2(n.y-P.y,n.x-P.x)}}else{buf=null;P.sf=.3;tone(110,.1,'square',.08)}}
 if(!P.act&&m>.15)P.face=Math.atan2(iy,ix);
 let sp=P.sp;
 if(P.act){P.t+=dt;const a=P.act;
  if(a=='roll'){P.x+=P.rx*330*(1-P.t/DUR.roll*.5)*dt;P.y+=P.ry*330*(1-P.t/DUR.roll*.5)*dt;sp=0}
  else sp=a=='flask'?40:22;
  if(a=='atk'&&!P.hit&&P.t>.1){P.hit=1;ATK[P.cls]()}
  if(a=='hvy'&&!P.hit&&P.t>.38){P.hit=1;HVY[P.cls]()}
  if(a=='flask'&&!P.hit&&P.t>.3){P.hit=1;ABIL[P.cls]()}
  if(P.t>=DUR[a])P.act=null}
 if(P.stun<=0&&sp){P.x+=ix*sp*dt;P.y+=iy*sp*dt}
 if(!P.act&&P.sd<=0)P.st=Math.min(P.mst,P.st+38*dt);
 P.x=cl(P.x,P.r,W-P.r);P.y=cl(P.y,P.r,H-P.r);
 for(const e of E){
  e.tm+=dt;e.fl-=dt;e.cd-=dt;
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx);
