function win(){

  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(cfg.text);u.lang='en-US';u.pitch=cfg.pitch;u.rate=cfg.rate;u.volume=1;
  const voices=window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[];
  const english=voices.filter(v=>/^en([_-]|$)/i.test(v.lang||''));
  const preferred=english.find(v=>cfg.voice.some(k=>(v.name||'').toLowerCase().includes(k)));
  if(preferred)u.voice=preferred;else if(english[0])u.voice=english[0];
